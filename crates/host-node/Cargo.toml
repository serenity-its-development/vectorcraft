[package]
name = "vectorcraft-host-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vector's host window compiled for node (wasm-bindgen), so OneOS can drive a drawing through the vector.* tools in a test: the same command.batch the browser build answers craft:command with, on the same engine"

# No workspace lints: the wasm-bindgen macros expand to code the workspace's `unsafe_code = "forbid"` refuses.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-engine = { workspace = true, features = ["bundled-fonts"] }
vectorcraft-format = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
